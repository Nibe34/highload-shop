upstream shop_backend {
    # weighted round robin: app-1 «потужніший» вузол
    zone shop_backend 64k;
    # resolve: вузли перерезолвлюються через DNS; зупинений контейнер не ламає старт nginx.
    # max_fails/fail_timeout — пасивний health check: 2 невдачі за 5 с → вузол виключається на 5 с.
    server app-1:8080 resolve weight=3 max_fails=2 fail_timeout=5s;
    server app-2:8080 resolve weight=1 max_fails=2 fail_timeout=5s;
    server app-3:8080 resolve weight=1 max_fails=2 fail_timeout=5s;
    keepalive 64;
}
