# pg_hba.conf для Primary (підключається через -c hba_file=...).
# TYPE  DATABASE        USER            ADDRESS         METHOD
local   all             all                             trust
host    all             all             127.0.0.1/32    trust
host    all             all             ::1/128         trust
# потік реплікації (WAL streaming) для Read-Replica
host    replication     replicator      all             scram-sha-256
# застосунки та адміністрування з мережі контейнерів
host    all             all             all             scram-sha-256
