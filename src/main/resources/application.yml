server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      # ЛР10: 16 потоків на інстанс з 1 CPU (див. docs/lab10-final.md, розділ 3)
      max: ${TOMCAT_MAX_THREADS:16}

spring:
  application:
    name: shop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

shop:
  instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
  session-ttl: 30m
  cart-ttl: 7d
  artificial-delay-ms: ${ARTIFICIAL_DELAY_MS:0}
  replica:
    enabled: ${REPLICA_ENABLED:false}
    url: ${REPLICA_DB_URL:}
    pool-size: ${REPLICA_POOL_SIZE:10}
    max-lag: 10s
    fence-ttl: ${FENCE_TTL:5s}
  shards:
    urls: ${SHARDS:a=jdbc:postgresql://localhost:5434/shop,b=jdbc:postgresql://localhost:5435/shop}
    strategy: ${SHARD_STRATEGY:BUCKETS}
    pool-size: ${SHARD_POOL_SIZE:10}
  cache:
    enabled: ${CACHE_ENABLED:true}
    breaker-open: 5s
    # ЛР8: стійкість кешованого шару (перемикаються наживо через Redis hash shop:flags)
    stampede: ${CACHE_STAMPEDE:LOCK_SINGLE_FLIGHT}
    ttl-jitter: true
    negative: true
    negative-ttl: 30s
    bloom: true
    lock-ttl: 5s
    lock-wait: 3s
    ttl:
      product: 5m
      catalog: 60s
      top-products: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
