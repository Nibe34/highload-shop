server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: shop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

shop:
  instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
  session-ttl: 30m
  cart-ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
