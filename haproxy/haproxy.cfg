# Альтернативний балансувальник з АКТИВНИМИ health check'ами (GET /health кожні 2 с).
global
    maxconn 10000

defaults
    mode http
    timeout connect 1s
    timeout client 30s
    timeout server 15s
    retries 2
    option redispatch
    option http-keep-alive

resolvers podman
    parse-resolv-conf
    hold valid 5s

frontend shop
    bind *:8081   # образ haproxy працює не від root — порт >1024
    default_backend shop_backend

backend shop_backend
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 resolvers podman init-addr last,libc,none
    server app-1 app-1:8080 check
    server app-2 app-2:8080 check
    server app-3 app-3:8080 check

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
