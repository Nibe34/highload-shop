name: shop

# Фіксована конфігурація ресурсів (однакова для всіх експериментів ЛР3–ЛР10).
x-app: &app
  build: .
  image: localhost/shop-app:latest
  cpus: 1.0
  mem_limit: 768m
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    postgres-shard-a:
      condition: service_healthy
    postgres-shard-b:
      condition: service_healthy
  networks: [backend]
  volumes:
    - ./profiling/tools:/profiling-tools:ro,z
  # Порти інстансів назовні НЕ публікуються: доступ лише через балансувальник.

x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/shop
  DB_USER: shop
  DB_PASSWORD: shop
  REDIS_HOST: redis
  # ЛР9: JVM-опції профілювання (JFR) і OpenTelemetry-агент вмикаються змінними середовища
  JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseG1GC}
  JAVA_TOOL_OPTIONS: ${OTEL_AGENT:-}
  # ЛР10: пул потоків під 1 CPU — менша конкуренція за CPU (ретроградна ділянка USL при 200 потоках)
  TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-16}
  OTEL_SERVICE_NAME: shop
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  REPLICA_ENABLED: ${REPLICA_ENABLED:-true}
  REPLICA_DB_URL: jdbc:postgresql://postgres-replica:5432/shop
  SHARDS: ${SHARDS:-a=jdbc:postgresql://postgres-shard-a:5432/shop,b=jdbc:postgresql://postgres-shard-b:5432/shop}
  SHARD_STRATEGY: ${SHARD_STRATEGY:-BUCKETS}

services:
  postgres:
    image: docker.io/library/postgres:17
    cpus: 2.0
    mem_limit: 1g
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    # Primary: WAL streaming для реплік, власний pg_hba.conf з дозволом replication-з'єднань
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB",
              "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all",
              "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10",
              "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,z
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  # Read-Replica: pg_basebackup з Primary при першому старті, далі асинхронна потокова реплікація (hot standby)
  postgres-replica:
    image: docker.io/library/postgres:17
    cpus: 2.0
    mem_limit: 1g
    entrypoint: ["/replica-entrypoint.sh"]
    command: ["-c", "max_connections=200", "-c", "shared_buffers=256MB", "-c", "hot_standby=on",
              "-c", "hot_standby_feedback=on",
              "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      PRIMARY_HOST: postgres
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
      REPLICA_SLOT: replica_1
    volumes:
      - pgreplica:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro,z
    ports:
      - "127.0.0.1:5433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [backend]

  # Шард замовлень a: незалежний вузол PostgreSQL (ключ шардингу — user_id)
  postgres-shard-a:
    image: docker.io/library/postgres:17
    cpus: 2.0
    mem_limit: 768m
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=128MB",
              "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    volumes:
      - pgsharda:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  # Шард замовлень b: незалежний вузол PostgreSQL (ключ шардингу — user_id)
  postgres-shard-b:
    image: docker.io/library/postgres:17
    cpus: 2.0
    mem_limit: 768m
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=128MB",
              "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    volumes:
      - pgshardb:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  # Спільне сховище стану: сесії, кошики, лічильники. AOF — щоб стан переживав рестарт Redis.
  redis:
    image: docker.io/library/redis:7.4
    cpus: 1.0
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  app-1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-1
      ARTIFICIAL_DELAY_MS: ${APP1_DELAY_MS:-0}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}

  app-2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-2
      ARTIFICIAL_DELAY_MS: ${APP2_DELAY_MS:-0}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}

  app-3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-3
      ARTIFICIAL_DELAY_MS: ${APP3_DELAY_MS:-0}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}

  # Єдина точка входу для клієнтів
  lb:
    image: docker.io/library/nginx:1.27
    cpus: 1.0
    mem_limit: 128m
    environment:
      LB_ALGO: ${LB_ALGO:-least-conn}
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro,z
      - ./nginx:/etc/nginx/shop:ro,z
    ports:
      - "8080:80"
    depends_on: [app-1, app-2, app-3]
    networks: [backend]

  # ЛР9: розподілене трасування (OTLP → Jaeger UI :16686). podman-compose --profile tracing up -d jaeger
  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.62.0
    profiles: [tracing]
    cpus: 1.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks: [backend]

  # Альтернативний LB з активними health check'ами: podman-compose --profile haproxy up -d haproxy
  haproxy:
    image: docker.io/library/haproxy:3.0
    profiles: [haproxy]
    cpus: 1.0
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,z
    ports:
      - "8090:8081"
      - "8404:8404"
    networks: [backend]

volumes:
  pgdata:
  pgreplica:
  pgsharda:
  pgshardb:
  redisdata:

networks:
  backend:
