name: shop

x-app: &app
  build: .
  image: localhost/shop-app:latest
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [backend]

x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/shop
  DB_USER: shop
  DB_PASSWORD: shop
  REDIS_HOST: redis

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  # Спільне сховище стану: сесії, кошики, лічильники. AOF — щоб стан переживав рестарт Redis.
  redis:
    image: docker.io/library/redis:7.4
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  app-1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-1
    ports:
      - "8081:8080"

  app-2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-2
    ports:
      - "8082:8080"

volumes:
  pgdata:
  redisdata:

networks:
  backend:
