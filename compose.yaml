name: shop

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  app:
    build: .
    image: localhost/shop-app:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shop
      DB_USER: shop
      DB_PASSWORD: shop
      INSTANCE_ID: app-1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
